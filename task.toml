name = "bore-drawdown"

# The verifier reads only these paths from the agent's final environment. Must stay top-level:
# nested under [verifier] the value is silently dropped and the verifier receives nothing.
artifacts = [
    "/app/bore/src/",
    "/app/data/",
    "/app/out/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Science"
subcategory = "Earth"
tags = ["java", "hydrogeology", "aliasing", "tides", "time-series", "least-squares"]
languages = ["java"]
difficulty = "core"
expert_time_estimate_hours = 5

difficulty_explanation = """
The compliance logger on this bore reads every 12 hours and the bore breathes with a 12.42 hour tide, 25 minutes longer than the logger interval, so every reading lands a little later in the tidal cycle than the one before, and what the logger records is the tide folded down: a slow swing of about 15 days and a fifth of a metre. The relationship the readings obey is disclosed rather than hidden. The README states as fact that the level sits flat while the bore is not abstracting, that it falls at a steady rate for as long as the abstraction continues so that any later day is that fall carried forward, and that every reading also carries a tidal sinusoid at the semidiurnal period evaluated at its own time, with the commissioning dump at 10 minutes showing the cycle plainly. How the tidal term and the rate of fall are fitted is the candidate's call, and acceptance is by the stated bars. What the README does not state, and what the record does not show, is that a term with a 12.42 hour period fitted at reading times 12 hours apart is exactly the 14.8 day swing in the record: an agent that reads the period off the dump and fits at the actual timestamps recovers the level; an agent that fits a swing at a period read by eye from the record, 14 or 15 days, or that ignores the swing, does not. The difficulty is in fitting that tide at the true reading times well enough to report each day's own mean with the tide still in it, rather than a tide-free trend or a straight line through the readings, and in doing it again on further exports whose interval, phase, rate, dates and licence settings are all different.

The product is the level itself, day by day: the depth to water for every day of the abstraction period as that day's own 24 hour mean with the tide still in it, plus the depth on the day the licence names and the verdict, scored against what the licence check's own 10 minute logger recorded as each day's mean. The straight line through the abstraction readings, which the README says is how the last return was done, is 85 mm out on the worst day of the shipped bore and 51 mm on the other, against a bar of 30 mm, and calls the shipped bore inside its licence when the check found it outside and the other bore a breach when it was compliant. A fit that carries the tide at the reading times is within 9 mm of every day's mean on both bores. The abstraction period is 18 days, a little over one swing, and the swing over that window happens to run against the drawdown, which is what makes the line's error a bias and not a wobble.

The commissioning dump is run in the week before each record opens, so the tidal term is read off data that sits beside the abstraction rather than months away from it, and a small error in the period does not have to be carried across a long gap. The second bore is dipped once a day instead of logged every 12 hours, with a different phase, amplitude, rate, dates and licence settings, and the licence question comes out the other way. A program that carries the shipped levels fails it; one that models the swing at a fixed 14.8 days measured in samples fails it too, since a daily logger folds the same tide to the same 14.8 days in half as many samples. The data are synthetic, generated by solution/gen_bore.py, and the key is the licence check as it was done, the day means of a 10 minute logger over the period and on the licence day; solution/calibrate.py reproduces every figure above.

Every record also carries a change of measuring point part way through, and both the README and bore.json state it: the well head was rebuilt, or the lid or the logger bracket was replaced, and from a stamp between two readings the point the readings are taken from sits above the casing top by an offset of that bore's own, 0.07 m from 12 August on the shipped bore, 0.05 m from 23 March on the second and 0.11 m from 27 May on the third, while the licence, the intake and the regulator's record all stay on the casing top. The export is written as measured, so the later readings carry the offset. A fit that takes the readings as written puts that step into the rate: on the shipped bore it reads the rate 4.7 mm/day high and the projected depth 0.43 m deep, and calls the bore in breach when the check found it compliant; on the second bore it is 0.36 m deep and on the third 0.86 m, against a bar of 0.10 m, and it misses the 0.03 m daily bar on every bore as well. The correction itself is a subtraction; what it takes is reading the export for what it says rather than for what a level series usually is.

The implementation is not the difficulty: a csv reader, a grid search over a period on the commissioning dump, a 4 by 4 least squares at the reading times, and a JSON line, all in the Java standard library. A flawless straight line fails the daily bar and the verdict on both bores. The bars are not knife-edge either: across twelve generated bores the fit that carries the tide at the reading times lands within 0.01 m of the licence day's mean on the shipped bore and 0.03 m on the other, against a bar of 0.10 m, and a fit that searches the period on the sampled series alone, without opening the commissioning dump, clears the same bar on every one of them.

In a real business this job belongs to a hydrogeologist or the environmental compliance officer at a water utility or a mine, and tidal loading on coastal monitoring bores logged at coarse intervals is a known and regularly missed hazard in exactly that work.
"""

solution_explanation = """
The reference (solution/solve.sh) installs src/Drawdown.java, compiles it and runs the class on /app/data. The verifier compiles the collected source itself rather than trusting any script. It reads bore.json for the abstraction start, the licence limit, the intake depth and the projection day, and the two csv files as timestamped series.

The tidal period is measured on the commissioning dump: for each candidate period between 10 and 14 hours, a level plus one sinusoid is fitted by least squares to the three days of 10 minute readings, and the period with the smallest residual is kept. On the shipped export that is 12.422 hours.

Every reading from the stamp bore.json gives as measuring_point_moved_at is first brought back onto the casing top by subtracting measuring_point_offset_m, since the licence and the regulator's record are depth below the casing top and the export is written as measured from wherever the point was. The compliance series is then fitted with four terms at the actual reading times: a constant, the days of abstraction elapsed at each reading, which is zero before the pump started, and the cosine and sine of the tide at the measured period. Because the tide is evaluated at the true times, the fitted sinusoid reproduces the folded swing the coarse logger recorded. Each day's level is the mean of that fitted level over the 24 hours the regulator takes, stepped every ten minutes with the tidal term carried into every step rather than dropped, because the period does not divide a day evenly; the projected depth is the same 24 hour mean on the projection day; the verdict follows the licence's two conditions from the reported rate and the projected depth. Everything is standard library: a hand-written normal-equations solve with partial pivoting and the java.time parser.

On the shipped export the daily levels are within 8 mm of every day's mean and the projected depth 2 mm off; on the other bore within 6 mm and 7 mm. Dropping the two tidal terms from the same fit, which is the oracle_straight_line arm, puts the worst day 85 mm out and gives the wrong verdict. Leaving the readings as written, which is the oracle_ignores_move arm, puts the projected depth 0.43 m deep on the shipped bore and 0.86 m on the third and misses the daily bar on all three.
"""

verification_explanation = """
Each bore breathes at its own period, 12.42 h on the shipped bore, 11.83 h on the second and 12.90 h on the third, so the period cannot be written into the source: it has to come off that bore's own commissioning dump. A reader who assumes the principal lunar constituent everywhere is 0.20 m out on the second bore and gets its verdict wrong on every seed, and 0.26 m out on the third against a 0.10 m bar. The oracle's own log shows it recovering 12.421, 11.827 and 12.901 hours from the three dumps.

The three bores also differ in every licence figure the report is graded against: limits of 8.1079, 2.4 and 6.0 mm/day and intakes of 7.80, 7.10 and 7.36 m, so neither can be assumed. They differ in the measuring point move too: the stamp and the offset are 2025-08-12T09:00 and 0.07 m, 2025-03-23T14:00 and 0.05 m, and 2025-05-27T11:00 and 0.11 m, each stated in that bore's README and carried in its bore.json, and every stamp falls between two readings, so nothing turns on whether a reading exactly at the stamp counts. A report that takes the readings as written is 0.43, 0.36 and 0.86 m out on the three projected depths against a 0.10 m bar, misses the daily bar on all three, and gets the shipped bore's verdict wrong, so the correction has to be read out of the export it is given. Each clause of the licence test is exercised by a bore that fails on that clause alone: the second breaches the rate by 1.63 mm/day while its level stays about 2.00 m above its intake, and the third stays 2.42 mm/day inside its rate while its projected depth sits exactly on the intake. The shipped bore's own licence_limit_mm_per_day is pinned to the reference's own reported rate and the third bore's own pump_intake_depth_m is pinned to the reference's own reported projected depth (gen_bore.py places both), so the inclusive rate comparison and the strict intake comparison are each exercised at the exact boundary on a real run rather than merely clear of it. Both figures are read off an aliased record, where the honest routes run 1.4 mm/day and 0.09 m out at worst, so grading a bore sitting on a limit against a separately fitted number would let ordinary estimation error decide the verdict instead of the comparator. test_verdict avoids that: it checks a run's own within_licence against the licence rule applied to that same run's own reported rate and depth, so nothing but a report whose own verdict contradicts its own numbers can fail there, whatever fitting method produced those numbers. oracle_rate_strict_lt and oracle_depth_le are that mistake, an inclusive comparison written strict and a strict one written inclusive, and each fails test_verdict on exactly the bore it is pinned to and nothing else.

Every .java file under src is compiled, which is what the instruction and the shipped build script both say, so splitting a helper class into its own file is allowed the way it is in any Java project. No outside library is put on the compile path, so the standard library that ships with Java is all a submission can reach, and the box is offline while the agent works. The build script is not run and nothing is claimed of it. bore.json carries only settings the report is actually graded on; the logger interval it used to record was never read by anything, because the timestamps on the readings are the cadence that matters, and a documented setting nothing consumes is a promise the verifier cannot keep.

The verifier runs in its own container. It collects the agent's Java sources, the build script and the shipped export as artifacts, compiles src/*.java itself with javac as an unprivileged build user, and runs the class it produced, so the graded figures always come out of a clean build of the agent's own code. The build script is not run: a script that did the work some other way would otherwise pass every figure with the stub in place. It is not collected either.

Compiling and running means the verifier executes code the agent wrote, so it does not do that as root. test.sh hands the project to the build user through setpriv with supplementary groups cleared and no-new-privileges set, runs the class from /app/bore, the directory the instruction documents, and while it runs every executable on the system paths except the java launcher itself is closed to that user, found by walking the directories rather than by a list, so the figures cannot come out of a Python the program shells out to; the cheat_python_shim arm is that construction and scores 0. Each run happens in its own session and its process group is torn down afterwards, then every process that user still owns is swept, so nothing the agent started is alive when the reward is written. Nothing inside the project is left executable while the class runs either: the walk closes the system paths, and every file the agent shipped inside /app/bore has its execute bits stripped before each run, so a helper binary carried in the project cannot do the work; the class the launcher runs needs no execute bit of its own. The dynamic loader still has to stay open, because java itself is a dynamically linked binary, and stripping execute bits does not stop it from reading a payload it is simply handed, so before the pristine copy of the project is ever compiled, anything under src that is not plain text is deleted; a NUL byte is what a binary carries and Java source never does. The collected class is then run under a small launcher this image compiles from its own source, never from the agent's project, which installs a SecurityManager refusing process execution and native library loading before calling the class's own main, so a submission that hands a payload to the loader, whether that payload was shipped in the project or written out at run time, gets a SecurityException instead of a result. cheat_native_delegate is that construction, planting a native file inside its own project at run time and handing it to ld-linux with ProcessBuilder, and it scores 0 with no report written. The three runs each ask for a different output destination, /app/out/drawdown.json, /app/out/second_bore.json and /app/out/third_bore.json, so a program that ignores the path it is handed and writes to a name of its own fails the later runs instead of passing unnoticed. The output is staged only if it is a regular file, moved to a root-owned path, and pytest reads that with O_NOFOLLOW; pytest never runs the agent's class. The keys live under /opt, readable only by root, and the /tests mount is closed to the build user before anything untrusted starts; if it is still reachable the run is abandoned with reward 0. pytest is called by full path with -P so nothing dropped into the working directory can shadow it.

Then the same class is run on the other bore's export, staged into a fresh directory only after the build has finished and its processes are gone, so nothing that ran during compilation could have had it on disk, and removed afterwards. That bore is logged once a day, with a different tidal phase and amplitude, a different rate, different dates and different licence settings, and the licence question comes out the other way.

Nineteen checks run and every one of them is a requirement instruction.md states. The four shipped files are unaltered by sha256. On each of the three runs: the output is one JSON object with exactly the five named keys, daily_depth_m keyed by every day of the abstraction period in the record and no others with finite values, a finite projected depth and a boolean; every day's level is within 0.03 m of the mean the licence logger recorded for that day; the projected depth is within 0.10 m of the mean on the licence day; and the verdict agrees with the check. The exports for the other two bores are staged, each with its own README, the same four files in the same format.

The bars sit in measured gaps and are named in the instruction, and the key is the licence check as it was done, the day means of a 10 minute logger, so the product is a daily series scored against labels the verifier holds, one per day, rather than a rate estimate. On the shipped export the reference is within 8 mm of every day's mean; the straight line through the abstraction readings is 34 mm out on average and 85 mm on the worst day; on the other bore the reference is within 6 mm and the line 29 mm on average and 51 mm on the worst day. The straight line reads the rate 6.2 mm/day low on the shipped bore and 5.7 high on the second, and first-to-last reads it 10.3 high and 12.1 low, so across the three bores the verdict test catches first-to-last on every seed while the daily and projected bars catch the straight line by ten times their margin. The honest routes, with the period read off the dump or searched on the samples alone, get all three verdicts right on every seed and stay inside 0.07 m. A day's figure is the mean of the level over that day and not the tide-free trend under it, because the semidiurnal period does not divide 24 hours: a whole day of the tide leaves a residue that walks with the tide against the clock. On the two inland bores that residue is 9 mm and 6 mm, small enough to hide; on the third bore, cut into the creek bank where the tide comes through at a metre, it reaches 40 mm against a 30 mm bar, so a report that carries the trend alone fails there. oracle_trend_only is that report and scores 0. The report also carries the tidal period the program fitted and the drawdown rate it worked out, and both are graded. The rate is graded twice over: against the regulator's own figure, and against the two depths the same report carries, since the instruction defines it as the fall between them over projection_day and a rate arrived at some other way would otherwise pass. The period is checked against the one the verifier reads off that export's own commissioning dump, so nothing is held back for it and the figure is fixed by bytes the candidate can read; two independent fits of that dump agree to 0.0006 h, and the bar is 0.15 h, wide enough to take a period read off the peaks of a noisy dump and still narrow enough to refuse the principal lunar period written into the source, 0.48 h from the third bore's and 0.59 from the second's. The README states that these are estuary bores on a semidiurnal tide, so the period sits between 10 and 15 hours, and the reference searches that band. The band is a fact about the coast rather than a method: the figure itself is still measured off each bore's own dump, and the three bores come in at 12.42, 11.83 and 12.90 hours. Eight arms run through the real verifier and each scores 0: oracle_straight_line, the reference with the two tidal terms removed and nothing else changed; oracle_trend_only, the reference reporting the fitted trend at the middle of each day rather than the day's mean, so the tidal residue is discarded; oracle_ignores_move, the reference with the measuring point correction removed so the readings go into the fit as written; cheat_frozen_result, the shipped figures written into the source as constants; cheat_native_delegate, a native file written into the project at run time and handed to the dynamic loader instead of doing the work in Java; oracle_rate_strict_lt, the inclusive rate comparison written as a strict less-than; oracle_depth_le, the strict intake comparison written as inclusive; and cheat_python_shim. The class is run on three exports, not two. The licence rule has two halves, a rate at or under the limit and a projection shallower than the pump intake, and the three bores cover the three ways that can fall out: the shipped bore clears both halves (its rate sitting exactly on the limit), the second breaches the rate while sitting well above its intake, and the third is well inside its rate limit while its projected depth sits exactly on the intake, so its verdict is false on the intake clause alone and a program that reads the rate and ignores pump_intake_depth_m gets it wrong. The licence limit itself is 8.1079 mm/day on the shipped bore, 2.4 on the second and 6.0 on the third, and each bore's rate sits at or between those figures, so a program that assumes any one limit rather than reading licence_limit_mm_per_day out of the export it is given returns the wrong verdict on at least one bore. The margins are otherwise wide against the way the rate is recovered: the honest routes read it within 0.3 mm/day, while the second bore sits 1.63 mm/day inside its limit; only the shipped bore's rate and the third bore's projected depth are built to sit exactly on a limit, which is what lets oracle_rate_strict_lt and oracle_depth_le be caught. That second bore also closes the record earlier in the day than abstraction began, so its last calendar day falls after its last reading, which is the case that separates a report covering every day named in the contract from one that stops at the last reading it holds. solution/gen_bore.py regenerates all three exports and all three keys byte for byte, with --rate 8 --interval 12 for the shipped bore, --rate 4 --interval 24 --hidden for the second and --rate 4 --interval 12 --third for the third, with the rate and the logger interval given explicitly, since its defaults are the shipped bore's: `gen_bore.py <out> <key> --rate 8 --interval 12` for the shipped bore, `--rate 4 --interval 24 --hidden` for the second, and `--rate 4 --interval 12 --third` for the third.
"""

relevant_experience = """
I have authored a batch of tasks for this edition, several of them accepted, all on one finding: the tasks that measure something are the ones where the agent's own check confirms the wrong answer. Here the wrong answer is the method the site has used and the regulator has accepted, it fits the readings it is given well, and nothing in those readings contradicts it; what contradicts it is a file from six months earlier and the physics of where the bore stands. I chose the window and the phase so that the straight line lands on the comfortable side of the licence on the shipped bore and the uncomfortable side on the other, and measured every route across noise seeds before placing the bars.
"""

[verifier]
# One compile and three runs of the agent's class. javac takes a few seconds and there is no
# dependency tree, so this is comfortable, but 1800 is the floor the platform requires.
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# Offline by design: the tool is written against the Java standard library, and network access
# would let the agent fetch a signal-processing library rather than think about the readings.
network_mode = "no-network"

[environment]
# Must be "public" on every task, offline ones included: this is the phase where the image is
# built and the agent harness is installed.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
